<script>

  try {
    const data = await API.get('/api/model/status');
    const badge = document.getElementById('sidebar-model-badge');
    if (badge) {
      badge.textContent = data.trained ? 'Model Ready' : 'Not Trained';
      badge.className = `badge ${data.trained ? 'badge-success' : 'badge-warning'}`;
    }
  } catch {}
})();
</script>




  <div class="main">
    <div class="topbar">
      <div><div class="topbar-title">Cases</div><div class="topbar-sub">Manage forensic cases</div></div>
      <div class="topbar-right">
        <button class="btn btn-primary" onclick="openCreateModal()">+ New Case</button>
      </div>
    </div>
    <div class="page-content">
      <div class="card">
        <div class="card-header">

            <span class="search-icon"></span>
            <input type="text" class="form-control" id="case-search" placeholder="Search cases…" style="width:220px" oninput="filterCases(this.value)">
          </div>
        </div>
        <div id="cases-container">
          <div class="empty-state"><div class="spinner spinner-lg" style="margin:0 auto"></div></div>
        </div>
      </div>
    </div>

<!-- Create Modal -->
<div class="modal-backdrop hidden" id="create-modal">
  <div class="modal">
    <div class="modal-title"> Create New Case</div>
    <div class="form-group">
      <label class="form-label">Case Name *</label>
      <input type="text" class="form-control" id="new-case-name" placeholder="e.g., Case 2024-001">
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea class="form-control" id="new-case-desc" placeholder="Optional case description or notes…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeCreateModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createCase()">Create Case</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/main.js"></script>
<script>
let allCases = [];

async function loadCases() {
  try {
    const data = await API.get('/api/cases');
    allCases = data.cases || [];
    renderCases(allCases);
  } catch(e) {
    toast('Failed to load cases: ' + (e.message || e.error || 'Unknown error'), 'error');
  }
}

function renderCases(cases) {
  const el = document.getElementById('cases-container');
  if (!cases.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="empty-icon"></div>
      <h3>No cases found</h3>
      <p>Create your first forensic case to begin analysis.</p>
      <button class="btn btn-primary mt-12" onclick="openCreateModal()">+ New Case</button>
    </div>`;
    return;
  }
  el.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Case Name</th>
          <th>Description</th>
          <th>Images</th>
          <th>Created</th>
          <th>Actions</th>
        </tr></thead>
        <tbody>${cases.map(c => `
          <tr>
            <td><strong>${c.name}</strong></td>
            <td class="text-secondary">${c.description || '—'}</td>
            <td><span class="badge badge-primary">${c.images?.length || 0}</span></td>
            <td class="td-mono text-sm">${fmtDate(c.created_at)}</td>
            <td>
              <div class="d-flex gap-8">
                <a href="analysis.html?case=${c.id}" class="btn btn-primary btn-sm">Open →</a>
                <button class="btn btn-secondary btn-sm" onclick="renameCase('${c.id}','${c.name.replace(/'/g,"\\'")}')">✏️</button>
                <button class="btn btn-danger btn-sm" onclick="deleteCase('${c.id}','${c.name.replace(/'/g,"\\'")}')">🗑️</button>
              </div>
            </td>
          </tr>
        `).join('')}</tbody>
      </table>
    </div>`;
}

function filterCases(q) {
  const filtered = allCases.filter(c =>
    c.name.toLowerCase().includes(q.toLowerCase()) ||
    (c.description || '').toLowerCase().includes(q.toLowerCase())
  );
  renderCases(filtered);
}

function openCreateModal() { document.getElementById('create-modal').classList.remove('hidden'); document.getElementById('new-case-name').focus(); }
function closeCreateModal() { document.getElementById('create-modal').classList.add('hidden'); }

async function createCase() {
  const name = document.getElementById('new-case-name').value.trim();
  const desc = document.getElementById('new-case-desc').value.trim();
  if (!name) { toast('Case name is required.', 'warning'); return; }
  try {
    const c = await API.post('/api/cases', { name, description: desc });
    toast(`Case "${c.name}" created!`, 'success');
    closeCreateModal();
    document.getElementById('new-case-name').value = '';
    document.getElementById('new-case-desc').value = '';
    Store.setCase(c);
    await loadCases();
  } catch(e) { toast(e.error || 'Create failed', 'error'); }
}

async function deleteCase(id, name) {
  showModal({
    title: '🗑️ Delete Case',
    content: `<p>Are you sure you want to delete <strong>"${name}"</strong>? This cannot be undone.</p>`,
    confirmText: 'Delete',
    confirmClass: 'btn-danger',
    onConfirm: async () => {
      try {
        await API.delete(`/api/cases/${id}`);
        toast(`Case "${name}" deleted.`, 'success');
        await loadCases();
      } catch(e) { toast(e.error || 'Delete failed', 'error'); }
    },
  });
}

async function renameCase(id, currentName) {
  const newName = prompt('New name for case:', currentName);
  if (!newName || newName === currentName) return;
  try {
    await API.put(`/api/cases/${id}`, { name: newName });
    toast('Case renamed.', 'success');
    await loadCases();
  } catch(e) { toast(e.error || 'Rename failed', 'error'); }
}

loadCases();
</script>
