<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — dextahhh</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body { background: #F2F4F6; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card {
      background: #FFFFFF; border-radius: 24px; padding: 48px;
      width: 100%; max-width: 440px; box-shadow: 0 12px 32px rgba(0,0,0,0.05);
      text-align: center;
    }
    .login-logo {
      width: 80px; height: 80px; background: var(--accent); border-radius: 20px;
      margin: 0 auto 24px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(3, 125, 214, 0.2);
    }
    .login-logo svg { width: 40px; height: 40px; fill: #fff; }
    h1 { font-size: 28px; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; letter-spacing: -0.03em; }
    p { font-size: 15px; color: var(--text-secondary); margin-bottom: 32px; font-weight: 500; }
    .form-group { text-align: left; margin-bottom: 24px; }
    .btn-login { width: 100%; font-size: 16px; padding: 16px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <!-- Fox-like or sleek modern logo placeholder -->
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </div>
    <h1>Welcome Back</h1>
    <p>Sign in to the dextahhh</p>
    
    <form id="login-form" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input type="text" class="form-control" placeholder="Enter your username" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-login">Login to Workspace</button>
    </form>
    
    <div style="margin-top: 24px; font-size: 14px; color: var(--text-muted);">
      <a href="#">Forgot password?</a>
    </div>
  </div>
</body>
</html>
